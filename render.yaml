services:
  - type: web
    name: docqa
    runtime: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --timeout 300 --workers 2"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: LLM_BACKEND
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_TEXT_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.6-27b
      - key: PYTHON_VERSION
        value: "3.12.6"
      # The free instance has limited memory and a request timeout. Processing
      # a very large PDF inline can exceed both; enable Celery with a worker,
      # or keep uploads modest on the free tier.
      - key: MAX_UPLOAD_MB
        value: "60"
