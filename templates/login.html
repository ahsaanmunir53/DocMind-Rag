<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · DocuMind</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#07070c;--card:rgba(255,255,255,.04);--line:rgba(255,255,255,.1);--ink:#f4f5fb;--muted:#9aa0b4;--brand:#7c7cff;--brand2:#a78bfa}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px;
      background-image:radial-gradient(60% 50% at 50% 0,rgba(124,124,255,.16),transparent)}
    .card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:38px;backdrop-filter:blur(12px)}
    .logo{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk';font-weight:700;font-size:20px;margin-bottom:6px}
    .logo .dot{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;box-shadow:0 0 20px rgba(124,124,255,.4)}
    .sub{color:var(--muted);font-size:14px;margin-bottom:26px}
    label{display:block;font-size:13px;font-weight:600;margin:16px 0 6px}
    input{width:100%;padding:12px 14px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:14px}
    input:focus{outline:none;border-color:var(--brand)}
    .btn{width:100%;margin-top:24px;padding:13px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0;border-radius:10px;font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 8px 24px rgba(124,124,255,.3)}
    .btn:hover{transform:translateY(-1px)}
    .err{background:rgba(220,38,38,.12);border:1px solid rgba(220,38,38,.3);color:#fda4a4;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:14px}
    .foot{text-align:center;margin-top:22px;font-size:13px;color:var(--muted)}
    .foot a{color:var(--brand2);font-weight:600;text-decoration:none}
    a.back{color:var(--muted);font-size:13px;text-decoration:none;display:inline-block;margin-bottom:20px}
    .pw{position:relative}
    .pw input{padding-right:64px}
    .peek{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;padding:6px 8px;border-radius:6px}
    .peek:hover{color:var(--ink);background:rgba(255,255,255,.06)}
    .row{display:flex;align-items:center;gap:9px;margin-top:18px}
    .row input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand);cursor:pointer;flex:none}
    .row label{margin:0;font-weight:500;font-size:13px;color:var(--muted);cursor:pointer}
    .btn:disabled{opacity:.6;cursor:default;transform:none}
    .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
    input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  </style>
</head>
<body>
  <form class="card" method="post">
    {% csrf_token %}
    <a class="back" href="/">← Back</a>
    <div class="logo"><span class="dot">◆</span> DocuMind</div>
    <p class="sub">Welcome back. Sign in to your documents.</p>
    {% if form.errors %}<div class="err">Wrong username or password. Try again.</div>{% endif %}
    <label for="id_username">Username</label>
    <input id="id_username" name="username" autocomplete="username" autofocus required />

    <label for="id_password">Password</label>
    <div class="pw">
      <input id="id_password" name="password" type="password"
             autocomplete="current-password" required />
      <button class="peek" type="button" id="peek" aria-label="Show password">Show</button>
    </div>

    <div class="row">
      <input type="checkbox" id="remember" name="remember" checked />
      <label for="remember">Keep me signed in for 30 days</label>
    </div>
    <p class="hint">Leave this unticked on a shared or public computer — your
      session will end when you close the browser.</p>

    <button class="btn" type="submit" id="submit">Sign in</button>
    <p class="foot">No account? <a href="{% url 'signup' %}">Create one</a></p>
  </form>
<script>
  // Show/hide the password. Typos are the most common reason a login fails,
  // and hiding the field makes them impossible to spot.
  const pw = document.getElementById("password") || document.getElementById("id_password");
  const peek = document.getElementById("peek");
  peek.addEventListener("click", () => {
    const showing = pw.type === "text";
    pw.type = showing ? "password" : "text";
    peek.textContent = showing ? "Show" : "Hide";
    peek.setAttribute("aria-label", showing ? "Show password" : "Hide password");
    pw.focus();
  });

  // Stop a double-click sending the form twice, and say what is happening.
  const form = document.querySelector("form");
  const btn = document.getElementById("submit");
  form.addEventListener("submit", () => {
    btn.disabled = true;
    btn.textContent = "Signing in…";
  });
</script>
</body>
</html>
